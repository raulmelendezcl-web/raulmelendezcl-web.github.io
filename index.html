<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Essencia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fbf3ea" />
    <meta name="color-scheme" content="light only" />
    <link rel="apple-touch-icon" sizes="512x512" href="essencia_icon_512.jpg" />
    <link rel="icon" type="image/jpeg" href="essencia_icon_512.jpg" />
    <title>Essencia Agenda</title>
    <link rel="stylesheet" href="hark.css" />
    <style>
      /* Warm, light palette for the whole app, in every theme */
      :root, :root[data-theme="light"], :root[data-theme="dark"] {
        color-scheme: light;
        --x-bg: #fbf3ea;
        --x-card: #fffaf4;
        --x-ink: #4a3428;
        --x-ink2: #7a5a48;
        --x-line: #ead8c6;
        --x-accent: #9c4a35;
        --x-accent-soft: #f6e1d6;
        --x-on-accent: #fffaf4;
        --x-les: #6b5a2e;
        --x-les-soft: #f1e8d2;
        --x-est: #a3445a;
        --x-est-soft: #f8e3e4;
        --x-amber: #8a5300;
        --x-amber-soft: #fbecd4;
        --x-ok: #2f6b3a;
        --x-ok-soft: #e6f0dc;
        --x-rent: #f3e7da;
        --x-wa: #25d366;
        --x-wa-ink: #06301a;
        --x-mauve: #9c4f86;
        --hover-wash: #9c4a3514;
        --text-primary: #4a3428;
        --text-secondary: #7a5a48;
        --fill-primary: #9c4a35;
        --text-primary-on: #fffaf4;
        --fill-primary-on: #fbf3ea;
        --fill-tertiary: #f3e7da;
        --stroke-primary: #dcc3ad;
        --stroke-secondary: #ead8c6;
        --fill-system-red: #b23a2a;
      }
      html, body { background: var(--x-bg); color: var(--x-ink); }
      ::selection { background: #f1cdbd; color: #4a3428; }
      button, input, select, textarea { font: inherit; color: inherit; }
      input, select, textarea { font-size: 16px; }
      .x-app { max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative; background: var(--x-bg); }
      @media (min-width: 520px) { .x-app { box-shadow: 0 0 0 1px var(--x-line); } }

      .x-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--x-bg) 88%, transparent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur); border-bottom: 1px solid var(--x-line); }
      .x-top img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
      .x-top__t { flex: 1; display: grid; min-width: 0; }
      .x-mv { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .x-mv li { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--x-line); border-radius: var(--r-s); background: var(--x-card); }
      .x-mv__top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
      .x-mv__t { font: var(--type-label); white-space: nowrap; }
      .x-mv__t s { color: var(--x-ink2); }
      .x-mv__w { font: var(--type-caption); color: var(--x-amber); }
      .x-btn.is-avisado { background: var(--x-ok-soft); border-color: transparent; color: var(--x-ok); }
      .x-dayhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .x-top__t b { font: var(--type-heading); letter-spacing: 0.06em; color: var(--x-ink); }
      .x-top__t small { font: var(--type-caption); color: var(--x-ink2); }
      .x-top__t .x-lema { font-style: italic; letter-spacing: 0.02em; line-height: 1.25; white-space: normal; }
      .x-icon { min-width: var(--tap); min-height: var(--tap); border: 0; background: transparent; border-radius: var(--r-pill); cursor: pointer; font: var(--type-label); color: var(--x-ink2); }
      .x-icon:hover { background: var(--hover-wash); }

      .x-view { padding: 16px 16px calc(130px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
      .x-view h2 { font: var(--type-heading); }
      .x-fine { font: var(--type-caption); color: var(--x-ink2); }
      .x-label { font: var(--type-tag); color: var(--x-ink2); text-transform: uppercase; letter-spacing: 0.06em; }

      .x-banner { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: var(--r-s); background: var(--x-accent-soft); font: var(--type-small); }
      .x-banner span { flex: 1; }
      .x-card { background: var(--x-card); border: 1px solid var(--x-line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 10px; }
      .x-sum p { font: var(--type-body); }

      .x-btn { min-height: var(--tap); padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--x-line); background: var(--x-card); font: var(--type-label); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
      .x-btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-btn--accent { background: var(--x-accent); border-color: var(--x-accent); color: var(--x-on-accent); }
      .x-btn--wa { background: var(--x-wa); border-color: var(--x-wa); color: var(--x-wa-ink); }
      .x-btn--big { min-height: 54px; width: 100%; font: var(--type-body-strong); }
      .x-btn--danger { color: var(--fill-system-red); }
      .x-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .x-row > .x-btn { flex: 1; }

      .x-days { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px; scrollbar-width: none; }
      .x-days button { flex: none; min-height: var(--tap); padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--x-line); background: var(--x-card); font: var(--type-label); cursor: pointer; }
      .x-days button[aria-pressed="true"] { background: var(--x-accent); border-color: var(--x-accent); color: var(--x-on-accent); }

      .x-tl { display: grid; }
      .x-slot { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--x-line); min-height: 58px; }
      .x-slot__h { font: var(--type-label); color: var(--x-ink2); padding-top: 8px; font-variant-numeric: tabular-nums; }
      .x-slot__c { display: grid; gap: 6px; }
      .x-appt { text-align: left; width: 100%; border: 1px solid var(--x-line); border-left: 4px solid var(--x-accent); background: var(--x-card); border-radius: var(--r-s); padding: 10px 12px; cursor: pointer; display: grid; gap: 6px; }
      .x-appt[data-t="lesion"] { border-left-color: var(--x-les); }
      .x-appt[data-t="estetica"] { border-left-color: var(--x-est); }
      .x-appt--hl { box-shadow: 0 0 0 2px var(--x-accent); }
      .x-appt__top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
      .x-appt__top b { font: var(--type-body-strong); }
      .x-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: var(--type-caption); color: var(--x-ink2); }
      .x-free { display: flex; align-items: center; justify-content: space-between; color: var(--x-ink2); font: var(--type-small); padding-left: 2px; }
      .x-add { width: var(--tap); height: var(--tap); border-radius: 50%; border: 1px dashed var(--x-line); background: transparent; font-size: 20px; color: var(--x-accent); cursor: pointer; }

      .x-b { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--r-pill); font: var(--type-tag); background: var(--x-accent-soft); color: var(--x-accent); }
      .x-b--les { background: var(--x-les-soft); color: var(--x-les); }
      .x-b--est { background: var(--x-est-soft); color: var(--x-est); }
      .x-s { display: inline-flex; padding: 2px 8px; border-radius: var(--r-pill); font: var(--type-tag); }
      .x-s--ok { background: var(--x-ok-soft); color: var(--x-ok); }
      .x-s--pend { background: var(--x-amber-soft); color: var(--x-amber); }
      .x-s--sent { background: var(--x-accent-soft); color: var(--x-accent); }

      .x-tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 30; display: grid; grid-template-columns: 1fr 1fr 104px 1fr 1fr; align-items: end; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--x-card) 92%, transparent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur); border-top: 1px solid var(--x-line); }
      .x-tab { min-height: 52px; border: 0; background: transparent; display: grid; place-items: center; gap: 2px; font: var(--type-caption); color: var(--x-ink2); cursor: pointer; border-radius: var(--r-s); }
      .x-tab svg { width: 22px; height: 22px; }
      .x-tab[aria-current="page"] { color: var(--x-accent); font-weight: var(--weight-medium); }
      .x-tab--mic { gap: 2px; width: 104px; justify-self: center; color: var(--x-accent); font: var(--type-tag); font-weight: var(--weight-medium); }
      .x-tab--mic span { width: 80px; height: 80px; margin-top: -48px; border-radius: 50%; background: var(--x-accent); background-clip: padding-box; color: var(--x-on-accent); display: grid; place-items: center; box-shadow: 0 8px 24px color-mix(in srgb, var(--x-accent) 45%, transparent); border: 4px solid var(--x-bg); }
      .x-tab--mic svg { width: 34px; height: 34px; }
      .x-tab--mic:hover span { box-shadow: inset 0 0 0 100px var(--hover-wash), 0 8px 24px color-mix(in srgb, var(--x-accent) 45%, transparent); }
      .x-voz { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-m); background: var(--x-accent-soft); }
      .x-voz .x-fine { flex: 1; color: var(--x-ink); }
      .x-mic--sm { width: 56px; height: 56px; flex: none; box-shadow: 0 6px 16px color-mix(in srgb, var(--x-accent) 30%, transparent); }
      .x-mic--sm svg { width: 26px; height: 26px; }
      .x-tab--mic[aria-current="page"] span { box-shadow: 0 0 0 3px var(--x-accent-soft), 0 6px 20px color-mix(in srgb, var(--x-accent) 40%, transparent); }
      .x-dict .x-banner { width: 100%; text-align: left; }
      .x-dict .x-btn--big { width: 100%; }
      .x-card__top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 24px; }
      .x-none { font: var(--type-body); color: var(--x-ink2); }

      .x-sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
      .x-sheet[hidden] { display: none; }
      .x-sheet__bg { position: absolute; inset: 0; background: rgb(0 0 0 / 0.35); border: 0; }
      .x-sheet__panel { position: relative; width: 100%; max-width: 480px; max-height: 88dvh; overflow-y: auto; background: var(--x-bg); border-radius: var(--r-l) var(--r-l) 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 14px; animation: x-up var(--dur-quick) var(--ease-out); }
      @keyframes x-up { from { transform: translateY(40px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .x-sheet__panel { animation: none; } }
      .x-sheet__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -8px; background: var(--x-bg); padding-top: 8px; z-index: 1; }
      .x-sheet__head h3 { font: var(--type-heading); }

      .x-dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font: var(--type-small); }
      .x-dl dt { color: var(--x-ink2); }
      .x-dl dd { margin: 0; }
      .x-bar { height: 8px; border-radius: var(--r-pill); background: var(--x-accent-soft); overflow: hidden; }
      .x-bar i { display: block; height: 100%; background: var(--x-accent); border-radius: inherit; }
      .x-note { padding: 10px 12px; border-radius: var(--r-s); background: var(--x-rent); font: var(--type-small); display: grid; gap: 4px; white-space: pre-line; }
      .x-msg { white-space: pre-wrap; font: var(--type-small); background: var(--x-rent); border-radius: var(--r-s); padding: 10px 12px; }

      .x-field { display: grid; gap: 6px; font: var(--type-tag); color: var(--x-ink2); }
      .x-field input, .x-field select, .x-field textarea, .x-in { width: 100%; min-height: var(--tap); border: 1px solid var(--x-line); border-radius: var(--r-s); background: var(--x-card); padding: 10px 12px; color: var(--x-ink); }
      .x-field textarea { resize: vertical; line-height: 1.4; }
      .x-two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
      .x-warn { padding: 8px 12px; border-radius: var(--r-s); background: var(--x-amber-soft); color: var(--x-amber); font: var(--type-small); }

      .x-list { display: grid; gap: 8px; }
      .x-li { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--x-line); border-radius: var(--r-m); background: var(--x-card); cursor: pointer; text-decoration: none; }
      .x-li b { font: var(--type-body-strong); }
      .x-li__plan { font: var(--type-label); color: var(--x-accent); }

      .x-dict { display: grid; justify-items: center; gap: 12px; text-align: center; padding-top: 8px; }
      .x-mic { width: 128px; height: 128px; border-radius: 50%; border: 0; background: var(--x-accent); color: var(--x-on-accent); display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 30px color-mix(in srgb, var(--x-accent) 35%, transparent); }
      .x-mic svg { width: 48px; height: 48px; }
      .x-mic.is-on { animation: x-pulse 1.4s ease-in-out infinite; }
      @keyframes x-pulse { 50% { box-shadow: 0 0 0 18px color-mix(in srgb, var(--x-accent) 18%, transparent); } }
      .x-dict .x-field { width: 100%; text-align: left; }
      .x-dict .x-row { width: 100%; }

      .x-toast { position: fixed; left: 50%; bottom: calc(178px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--x-accent-soft); color: var(--x-ink); border: 1px solid #e3bfae; padding: 12px 18px; border-radius: var(--r-pill); font: var(--type-label); box-shadow: 0 8px 24px rgb(122 80 56 / 0.18); max-width: 90vw; }
      .x-toast[hidden] { display: none; }
      .x-splash { position: fixed; inset: 0; z-index: 100; background: var(--x-bg); display: grid; place-content: center; justify-items: center; gap: 14px; transition: opacity 400ms var(--ease-out); }
      .x-splash img { width: 200px; height: 200px; border-radius: var(--r-l); }
      .x-splash p { font: var(--type-label); letter-spacing: 0.04em; color: var(--x-ink2); text-align: center; padding: 0 24px; }
      .x-rule { width: 48px; height: 0; border: 0; border-top: 1px solid var(--x-mauve); margin: 0; }
      .x-splash.is-out { opacity: 0; pointer-events: none; }
      .x-about { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 8px 0; }
      .x-walink { display: inline-block; margin-top: 4px; font: var(--type-caption); color: var(--x-ink2); word-break: break-all; -webkit-touch-callout: default; }
      .x-about img { width: 140px; height: 140px; border-radius: var(--r-m); }
      .x-about__who { font: var(--type-label); color: var(--x-ink); margin-top: -4px; }
      .x-hola { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
      .x-hola__txt { display: grid; gap: 2px; min-width: 0; }
      .x-avatar { position: relative; flex: none; width: 48px; height: 48px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, var(--x-mauve), var(--x-accent)); }
      .x-avatar__in { position: relative; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--x-bg); background: var(--x-accent-soft); color: var(--x-accent); display: grid; place-items: center; overflow: hidden; font: var(--type-label); font-weight: var(--weight-bold); letter-spacing: 0.04em; }
      .x-avatar__in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; border-radius: 50%; color: transparent; font-size: 0; }
      .x-dhint { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-m); background: var(--x-accent-soft); color: var(--x-ink); font: var(--type-body); }
      .x-dhint__ic { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--x-accent); color: var(--x-on-accent); display: grid; place-items: center; }
      .x-dhint__ic svg { width: 22px; height: 22px; }
      .x-dhint.is-flash { animation: x-flash 1.2s var(--ease-out) 1; }
      @keyframes x-flash { 30% { box-shadow: 0 0 0 4px var(--x-accent); } }
      @media (prefers-reduced-motion: reduce) { .x-dhint.is-flash { animation: none; } }
      .x-vtxt { width: 100%; min-height: 168px; border: 1px solid var(--x-line); border-radius: var(--r-s); background: var(--x-card); padding: 12px; color: var(--x-ink); font-size: 17px; line-height: 1.45; resize: vertical; }
      .x-vtxt:focus { outline: 2px solid var(--x-accent); outline-offset: 1px; }
      .x-btn.is-on { animation: x-pulse 1.4s ease-in-out infinite; }
      .x-prev { display: grid; gap: 10px; }
      .x-prev ul { margin: 0; padding-left: 18px; font: var(--type-small); }

      /* Warm, light menus: tab bar and every sheet stay cream in both themes */
      .x-tabs, .x-sheet__panel {
        color-scheme: light;
        --x-bg: #fbf3ea;
        --x-card: #fffaf4;
        --x-ink: #4a3428;
        --x-ink2: #7a5a48;
        --x-line: #ead8c6;
        --x-accent: #9c4a35;
        --x-accent-soft: #f6e1d6;
        --x-on-accent: #fffaf4;
        --x-rent: #f3e7da;
        --hover-wash: #9c4a3514;
        color: var(--x-ink);
      }
      .x-tabs { background: color-mix(in srgb, #f8ece0 94%, transparent); border-top-color: #e6d0bb; box-shadow: 0 -6px 24px rgb(122 80 56 / 0.08); }
      .x-tab--mic span { background: linear-gradient(145deg, #b8644c, #9c4a35); border-color: #f8ece0; box-shadow: 0 8px 24px rgb(169 83 61 / 0.35); }
      .x-tab--mic:hover span { box-shadow: inset 0 0 0 100px #ffffff1f, 0 8px 24px rgb(169 83 61 / 0.35); }
      .x-tab--mic[aria-current="page"] span { box-shadow: 0 0 0 3px #f1cdbd, 0 6px 20px rgb(169 83 61 / 0.35); }
      .x-tab[aria-current="page"]:not(.x-tab--mic) { background: #f3dccf; }
      .x-sheet__panel { background: var(--x-bg); box-shadow: 0 -10px 40px rgb(74 52 40 / 0.18); }
      .x-sheet__bg { background: rgb(74 52 40 / 0.32); }

      /* Fotos / Evolución */
      .x-evo { display: grid; gap: 10px; }
      .x-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
      label.x-btn { position: relative; }
      label.x-btn:focus-within { outline: 2px solid var(--x-accent); outline-offset: 2px; }
      .x-btn:disabled { opacity: 0.6; cursor: default; }
      .x-seg { display: flex; gap: 6px; flex-wrap: wrap; }
      .x-seg button { min-height: var(--tap); padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--x-line); background: var(--x-card); font: var(--type-label); color: var(--x-ink); cursor: pointer; }
      .x-seg button[aria-pressed="true"] { background: var(--x-accent); border-color: var(--x-accent); color: var(--x-on-accent); }
      .x-evo__prev { width: 100%; max-height: 260px; object-fit: contain; border-radius: var(--r-s); background: var(--x-rent); }
      .x-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .x-ph { border: 0; padding: 0; background: none; text-align: left; cursor: pointer; display: grid; gap: 2px; align-content: start; color: var(--x-ink); min-width: 0; }
      .x-ph__img { position: relative; display: block; aspect-ratio: 3 / 4; border-radius: var(--r-s); overflow: hidden; background: var(--x-rent); }
      .x-ph__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .x-ph__img .x-s { position: absolute; left: 6px; top: 6px; }
      .x-ph b { font: var(--type-caption); font-weight: var(--weight-medium); }
      .x-ph small { font: var(--type-caption); color: var(--x-ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .x-empty { padding: 18px 14px; border: 1px dashed var(--stroke-primary); border-radius: var(--r-m); text-align: center; font: var(--type-small); color: var(--x-ink2); }

      .x-visor { position: fixed; inset: 0; z-index: 55; background: #2e211a; color: #fbf3ea; display: flex; justify-content: center; overflow-y: auto; }
      .x-visor[hidden] { display: none; }
      .x-visor__in { width: 100%; max-width: 480px; display: grid; gap: 12px; align-content: start; padding: calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); }
      .x-visor__top { display: flex; align-items: center; gap: 8px; }
      .x-visor__top b, .x-visor__top h3 { flex: 1; font: var(--type-heading); }
      .x-visor .x-icon { color: inherit; }
      .x-visor__img { display: grid; place-items: center; }
      .x-visor__img img { max-width: 100%; max-height: calc(100dvh - 300px); object-fit: contain; border-radius: var(--r-s); }
      .x-visor__nota { font: var(--type-body); }

var SLOT_MIN = 30, DIA_INI = 9 * 60, DIA_FIN = 19 * 60;
function aMin(h) { var p = String(h).split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function deMin(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }

// Builds every WhatsApp link. The full message is a plain JS string; it is encoded exactly once
// with encodeURIComponent (UTF-8, so emoji like 👋 🌿 📅 😊 stay intact and "\n" becomes %0A).
// Uses WhatsApp's send endpoint directly: the wa.me redirect re-encodes the text and breaks 4-byte emoji into replacement characters.
function waTexto(texto) {
  var s = String(texto == null ? "" : texto).replace(/\r\n?/g, "\n");
  if (s.toWellFormed) s = s.toWellFormed(); // a lone surrogate would make encodeURIComponent throw
  return s;
}

ACT.evodel = function (b) {
  if (!confirm("¿Eliminar esta foto? No se puede deshacer.")) return;
  var pid = E.pid;
  fotoBorrar(b.dataset.id).then(function () { cerrarVisor(); toast("Foto eliminada"); cargarEvo(pid); });
};
ACT.evocmpsend = function () {
  var a = fotoPorId(E.cmpA), d = fotoPorId(E.cmpD), p = pac(E.pid); if (!E.cmpBlob || !a || !d || !p) return;
  enviarImagen(E.cmpBlob, nombreArchivo(p, "evolucion-" + d.fecha), "Hola " + p.nom.split(" ")[0] + " 🌿 Mira tu evolución: " + fechaFoto(a.fecha) + " → " + fechaFoto(d.fecha) + ". ¡Vas muy bien!\n" + CIERRE, p);
};
ACT.evocmpsave = function () { var d = fotoPorId(E.cmpD), p = pac(E.pid); if (!E.cmpBlob || !d || !p) return; descargar(E.cmpBlob, nombreArchivo(p, "evolucion-" + d.fecha)); toast("Imagen guardada"); };
fdbOpen();

document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
});
document.addEventListener("input", function (e) {
  if (e.target.id === "buscar") { S.q = e.target.value; el("plist").innerHTML = listaPac(); }
  if (e.target.id === "dtxt") D.txt = e.target.value;
  if (e.target.id === "vtxt") { vInput(e.target.value); return; }
  if (e.target.id === "fvoz") { if (e.target.value.trim()) { llenarFicha(e.target.value); ferr(""); } return; }
  if (!D.res) return;
  if (e.target.id === "rmsg") D.res.msg = e.target.value;
  if (e.target.id === "rtrat") D.res.tratTxt = e.target.value;
  if (e.target.id === "rtel") D.res.tel = e.target.value;
  if (e.target.id === "rnom") { var nv = e.target.value.trim(); D.res.nom = nv ? cap(nv) : "Paciente nueva"; el("rnuevo").textContent = "Paciente nueva" + (nv ? ": " + D.res.nom : ""); regenMsg(); refSum(); }
  if (e.target.id === "rind") { D.res.ind = leerInd(e.target.value); regenMsg(); }
});
document.addEventListener("change", function (e) {
  if (e.target.dataset && e.target.dataset.evo === "file") { evoArchivo(e.target); return; }
  if (e.target.id === "cmpa") { E.cmpA = e.target.value; visorComparar(); return; }
  if (e.target.id === "cmpd") { E.cmpD = e.target.value; visorComparar(); return; }
  if (e.target.id === "ftel" && e.target.value.trim()) e.target.value = telefono(e.target.value);
  if (e.target.id === "atrcita") { A.cid = e.target.value; hojaAtrasar(); return; }
  if (e.target.id === "mfecha") { var mid = e.target.dataset.id, mf = e.target.value; el("mhora").innerHTML = opcionesLibres(mf, mid); el("mok").disabled = !libres(mf, mid).length; return; }
  if ((e.target.id === "rfecha" || e.target.id === "rhora") && D.res) {
    D.res.fecha = el("rfecha").value; D.res.hora = el("rhora").value;
    el("rchoque").innerHTML = avisoChoque();
    regenMsg(); refSum();
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (!el("visor").hidden) cerrarVisor(); else cerrar(); } });
render();
/* ?dictado=<texto> o #dictado=<texto>: abre Dictar con el texto y la vista previa (para un Atajo de Siri) */
(function () {
  var t = null;
  try { t = new URLSearchParams(location.search).get("dictado"); } catch (e) {}
  if (!t) { var m = /(?:^#|&)dictado=([^&]*)/.exec(location.hash); if (m) { try { t = decodeURIComponent(m[1].replace(/\+/g, " ")); } catch (e) { t = m[1]; } } }
  if (!t || !t.trim()) return;
  D.txt = t.trim(); D.res = null; D.pid = null; D.err = ""; S.vista = "dictar"; render(); hojaDictar();
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
})();
setTimeout(function () { el("splash").classList.add("is-out"); }, 900);
